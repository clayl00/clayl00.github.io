<div class="home-layout">
  <aside class="sidebar-panel" style="display: flex; flex-direction: column;">
    <div class="sidebar-header" style="padding-bottom: 16px; border-bottom: 1px solid rgba(0,0,0,0.05);">
      <router-link to="/" class="btn-back" style="margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        BACK HOME
      </router-link>
      <h4 style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.8;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        Hidden Chats
      </h4>
      <p style="font-size: 0.85rem; color: var(--ink-light); font-family: var(--font-sans);">Chats you have removed from your desk.</p>
    </div>

    <div class="chat-lists-container" style="flex: 1; overflow-y: auto; padding-top: 16px;">
      
      <transition-group name="chat-list" tag="ul" class="chat-list" style="margin-top: 8px;">
        <li v-for="chat in hiddenChatsList" :key="chat.value?.channel" style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding: 8px 16px;">
          
          <div class="chat-item" style="flex-grow: 1; border-bottom: none; opacity: 0.7; padding: 8px 0; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            {{ chat.value.title }}
          </div>
          
          <div style="display: flex; gap: 8px;">
            <button @click="restoreChat(chat)" class="btn-icon" style="width: 28px; height: 28px; background: var(--primary);" title="Restore Chat">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
            </button>
            
            <button @click="permanentlyDeleteChat(chat)" class="btn-icon" style="width: 28px; height: 28px; background: #e74c3c;" title="Permanently Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
          
        </li>
        <li v-if="hiddenChatsList.length === 0" key="empty-trash" style="padding: 16px 24px; color: gray; font-size: 0.9em; text-align: center;">
          No hidden chats.
        </li>
      </transition-group>
      
    </div>
  </aside>

  <main class="empty-state">
    <div class="watermark-clef">&#119070;</div>
    <div style="text-align:center; z-index:1;">
      <h2 style="font-family: var(--font-serif); margin-bottom: 8px;">Hidden Chats</h2>
      <p style="font-family: var(--font-sans); color: var(--ink-light);">Restore hidden chats or permanently delete them.</p>
    </div>
  </main>
</div>
